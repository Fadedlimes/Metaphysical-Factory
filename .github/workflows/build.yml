name: Multi-Platform Build & Package

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (x64)
            os: windows-latest
            artifact_name: MetaphysicalFactory-Windows

          - name: macOS (Universal M1/M2/M3 + Intel)
            os: macos-latest
            artifact_name: MetaphysicalFactory-macOS

          - name: Linux (x64)
            os: ubuntu-22.04
            artifact_name: MetaphysicalFactory-Linux

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libx11-dev \
            libxinerama-dev \
            libxext-dev \
            libfreetype6-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libxcursor-dev \
            libxrandr-dev

      # Configures CMake with proper bash quotation for macOS universal binary
      - name: Configure CMake
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "macOS" ]; then
            cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          else
            cmake -B build -DCMAKE_BUILD_TYPE=Release
          fi

      - name: Build Plugin & Standalone
        run: cmake --build build --config Release --parallel 4

      # --- Packaging Windows ---
      - name: Package Windows Artifacts
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p package/VST3 package/Standalone
          cp -r build/MetaphysicalFactory_artefacts/Release/VST3/* package/VST3/ || true
          cp -r build/MetaphysicalFactory_artefacts/Release/Standalone/* package/Standalone/ || true
          7z a MetaphysicalFactory-Windows.zip ./package/*

      # --- Packaging macOS ---
      - name: Package macOS Artifacts
        if: runner.os == 'macOS'
        run: |
          mkdir -p package/VST3 package/Standalone
          cp -r build/MetaphysicalFactory_artefacts/Release/VST3/* package/VST3/ || true
          cp -r build/MetaphysicalFactory_artefacts/Release/Standalone/* package/Standalone/ || true
          cd package && zip -r ../MetaphysicalFactory-macOS.zip *

      # --- Packaging Linux ---
      - name: Package Linux Artifacts
        if: runner.os == 'Linux'
        run: |
          mkdir -p package/VST3 package/Standalone
          cp -r build/MetaphysicalFactory_artefacts/Release/VST3/* package/VST3/ || true
          cp -r build/MetaphysicalFactory_artefacts/Release/Standalone/* package/Standalone/ || true
          tar -czvf MetaphysicalFactory-Linux.tar.gz -C package .

      # --- Upload Workflow Artifacts ---
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            *.zip
            *.tar.gz

  # Consolidated single release job after all platforms build successfully
  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded_artifacts

      - name: Flatten Artifact Directory
        run: |
          mkdir -p release_assets
          find downloaded_artifacts -type f \( -name "*.zip" -o -name "*.tar.gz" \) -exec cp {} release_assets/ \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
